[project]
name = "sur1w1r3"
version = "1.0.0"
description = "Sur1W1r3: ship Suricata EVE telemetry to a SOC"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "ThreatPulse contributors" },
]
keywords = ["security", "soc", "siem", "suricata", "ids", "sur1w1r3", "netflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
sur1w1r3 = "suricata_shipper.__main__:main"
# Preserve the original executable name for existing sensor installations.
suricata-shipper = "suricata_shipper.__main__:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
