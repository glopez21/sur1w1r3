# logrotate fragment for Suricata's EVE output.
#
# Installed as /etc/logrotate.d/suricata. The shipper detects rotation by inode
# change and restarts reading from the new file, so copytruncate is NOT required
# and is deliberately avoided: with rename-then-create, Suricata keeps writing
# to the old inode and the shipper follows the new one without losing records.
#
# Do not add copytruncate here. An in-place truncation keeps the same inode, so
# the shipper can only notice it while the file is still shorter than its last
# read position; if the file regrows past that point before the next cycle, the
# records in between are silently skipped. The postrotate HUP below is what makes
# this policy safe: it makes Suricata reopen the log, so the new file has a new
# inode and the change is unambiguous.

/var/log/suricata/*.json {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    create 0640 suricata suricata
    su suricata suricata
    sharedscripts
    postrotate
        if [ -f /var/run/suricata.pid ]; then
            kill -HUP "$(cat /var/run/suricata.pid)" || true
        fi
    endscript
}
